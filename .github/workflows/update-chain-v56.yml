name: SurveyQuant V1.0.56 Update Chain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chain-v56:

    name: SurveyQuant V1.0.56 Update Chain

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Detect Android Project
        id: detect
        shell: bash
        run: |
          echo "======================================"
          echo "Searching for Gradle Wrapper..."
          echo "======================================"

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Repository structure:"
            find . -maxdepth 4 -type f | sort | head -300
            echo ""
            echo "This repository does not contain a Gradle Wrapper."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle Wrapper found:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Grant Gradle Permission
        run: |
          chmod +x "${{ steps.detect.outputs.project_dir }}/gradlew"

      - name: Verify Project
        run: |
          cd "${{ steps.detect.outputs.project_dir }}"

          echo "======================================"
          echo "SurveyQuant V1.0.56"
          echo "======================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      - name: Clean Previous Build
        run: |
          cd "${{ steps.detect.outputs.project_dir }}"
          ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: |
          cd "${{ steps.detect.outputs.project_dir }}"
          ./gradlew assembleDebug --stacktrace

      - name: Find Generated APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.detect.outputs.project_dir }}"

          echo "======================================"
          echo "Searching for generated APK..."
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare V1.0.56 Update APK
        shell: bash
        run: |
          mkdir -p release

          cp "${{ steps.apk.outputs.apk }}" \
             "release/SurveyQuant-V1.0.56-Update.apk"

          echo "======================================"
          echo "SurveyQuant V1.0.56 Update"
          echo "======================================"

          ls -lh release/

      - name: Upload V1.0.56 APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-V1.0.56-Update-Chain
          path: release/SurveyQuant-V1.0.56-Update.apk
          if-no-files-found: error

      - name: Build Summary
        if: success()
        run: |
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "SurveyQuant V1.0.56"
          echo ""
          echo "APK:"
          echo "SurveyQuant-V1.0.56-Update.apk"
          echo ""
          echo "Update Chain: READY"

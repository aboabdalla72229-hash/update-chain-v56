name: SurveyQuant V1.0.56 Update Chain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  update-chain-v56:

    name: Build SurveyQuant V1.0.56
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # 2. Find ZIP
      # ==========================================

      - name: Find Update Chain ZIP
        id: zip
        shell: bash
        run: |

          echo "======================================"
          echo "Searching for V1.0.56 Update Chain ZIP"
          echo "======================================"

          ZIP=$(find . -maxdepth 3 -type f \
            -iname "*1.0.56*UPDATE*CHAIN*.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Update Chain ZIP not found."
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 3. Extract ZIP
      # ==========================================

      - name: Extract Update Chain
        shell: bash
        run: |

          echo "======================================"
          echo "Extracting V1.0.56"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.zip.outputs.zip }}" \
            -d extracted

          echo ""
          echo "Extraction completed."

          find extracted -maxdepth 5 -type f | sort | head -300


      # ==========================================
      # 4. Detect Gradle Project
      # ==========================================

      - name: Detect Android Project
        id: project
        shell: bash
        run: |

          echo "======================================"
          echo "Detecting Android Project"
          echo "======================================"

          GRADLEW=$(find extracted \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR=$(dirname "$GRADLEW")

            echo "Gradle Wrapper:"
            echo "$GRADLEW"

          else

            SETTINGS=$(find extracted \
              -type f \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -print \
              -quit)

            if [ -n "$SETTINGS" ]; then

              PROJECT_DIR=$(dirname "$SETTINGS")

            else

              BUILD=$(find extracted \
                -type f \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -print \
                -quit)

              if [ -z "$BUILD" ]; then

                echo "ERROR: Gradle project not found."

                find extracted -maxdepth 8 -type f | sort

                exit 1

              fi

              PROJECT_DIR=$(dirname "$BUILD")

            fi

          fi

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 5. Setup Java
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 6. Setup Gradle
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      # ==========================================
      # 7. Prepare Gradle
      # ==========================================

      - name: Prepare Gradle
        shell: bash
        run: |

          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          echo "======================================"
          echo "Project"
          echo "======================================"

          pwd

          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper detected."
          else
            echo "Gradle Wrapper not found."
            echo "System Gradle will be used."
          fi


      # ==========================================
      # 8. Inspect Build Configuration
      # ==========================================

      - name: Inspect App Build Configuration
        shell: bash
        run: |

          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "======================================"
          echo "APP BUILD CONFIGURATION"
          echo "======================================"

          APP_GRADLE="$PROJECT/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then

            APP_GRADLE="$PROJECT/app/build.gradle.kts"

          fi

          if [ ! -f "$APP_GRADLE" ]; then

            echo "ERROR: app/build.gradle not found."

            find "$PROJECT" \
              -maxdepth 4 \
              -type f \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -print

            exit 1

          fi

          echo ""
          echo "BUILD FILE:"
          echo "$APP_GRADLE"

          echo ""
          echo "======================================"
          echo "BUILD.GRADLE CONTENT"
          echo "======================================"

          sed -n '1,180p' "$APP_GRADLE"


      # ==========================================
      # 9. Prepare Debug Signing
      # ==========================================

      - name: Prepare Debug Signing
        shell: bash
        run: |

          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          echo "======================================"
          echo "Preparing Debug Build"
          echo "======================================"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

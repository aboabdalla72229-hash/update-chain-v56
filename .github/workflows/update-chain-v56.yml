name: SurveyQuant V1.0.56 Update Chain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  update-chain-v56:

    name: Build SurveyQuant V1.0.56
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # 2. Find ZIP
      # ==========================================

      - name: Find Update Chain ZIP
        id: zip
        shell: bash
        run: |

          echo "======================================"
          echo "Searching for V1.0.56 Update Chain ZIP"
          echo "======================================"

          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" -print | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 3. Extract ZIP
      # ==========================================

      - name: Extract Update Chain
        shell: bash
        run: |

          echo "======================================"
          echo "Extracting SurveyQuant V1.0.56"
          echo "======================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.zip.outputs.zip }}" \
            -d extracted

          echo ""
          echo "Extraction completed."


      # ==========================================
      # 4. Detect Android Project
      # ==========================================

      - name: Detect Android Project
        id: project
        shell: bash
        run: |

          echo "======================================"
          echo "Detecting Android Project"
          echo "======================================"

          GRADLEW=$(find extracted -type f -name "gradlew" -print | head -n 1)

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR=$(dirname "$GRADLEW")

          else

            SETTINGS=$(find extracted -type f -name "settings.gradle" -print | head -n 1)

            if [ -z "$SETTINGS" ]; then
              SETTINGS=$(find extracted -type f -name "settings.gradle.kts" -print | head -n 1)
            fi

            if [ -n "$SETTINGS" ]; then

              PROJECT_DIR=$(dirname "$SETTINGS")

            else

              BUILD=$(find extracted -type f -name "build.gradle" -print | head -n 1)

              if [ -z "$BUILD" ]; then
                BUILD=$(find extracted -type f -name "build.gradle.kts" -print | head -n 1)
              fi

              if [ -z "$BUILD" ]; then

                echo "ERROR: Gradle project not found."

                find extracted -maxdepth 8 -type f -print

                exit 1

              fi

              PROJECT_DIR=$(dirname "$BUILD")

            fi

          fi

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 5. Setup Java
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 6. Setup Gradle
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      # ==========================================
      # 7. Create CI Keystore
      # ==========================================

      - name: Create CI Signing Keystore
        shell: bash
        run: |

          echo "======================================"
          echo "Creating CI Signing Keystore"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/signing"

          keytool \
            -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/signing/surveyquant-ci.jks" \
            -storetype JKS \
            -storepass "SurveyQuantCIStore2026" \
            -alias "surveyquant" \
            -keypass "SurveyQuantCIKey2026" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SurveyQuant,O=SurveyQuant,C=EG"

          echo ""
          echo "Keystore created."

          ls -lh "$GITHUB_WORKSPACE/signing/"


      # ==========================================
      # 8. Configure Signing Environment
      # ==========================================

      - name: Configure SurveyQuant Signing
        shell: bash
        run: |

          echo "======================================"
          echo "Configuring SurveyQuant Signing"
          echo "======================================"

          echo "SURVEYQUANT_KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/surveyquant-ci.jks" >> "$GITHUB_ENV"

          echo "SURVEYQUANT_KEYSTORE_PASSWORD=SurveyQuantCIStore2026" >> "$GITHUB_ENV"

          echo "SURVEYQUANT_KEY_ALIAS=surveyquant" >> "$GITHUB_ENV"

          echo "SURVEYQUANT_KEY_PASSWORD=SurveyQuantCIKey2026" >> "$GITHUB_ENV"

          echo "Signing variables configured."


      # ==========================================
      # 9. Verify Signing Configuration
      # ==========================================

      - name: Verify Signing Configuration
        shell: bash
        run: |

          echo "======================================"
          echo "VERIFYING SIGNING"
          echo "======================================"

          if [ -f "$SURVEYQUANT_KEYSTORE_FILE" ]; then

            echo "Keystore file exists."

          else

            echo "ERROR: Keystore file does not exist."

            exit 1

          fi

          echo ""
          echo "Keystore path:"
          echo "$SURVEYQUANT_KEYSTORE_FILE"

          echo ""
          echo "Alias:"
          echo "$SURVEYQUANT_KEY_ALIAS"


      # ==========================================
      # 10. Prepare Gradle
      # ==========================================

      - name: Prepare Gradle
        shell: bash
        run: |

          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          echo "======================================"
          echo "PROJECT"
          echo "======================================"

          pwd

          ls -la

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "Gradle Wrapper detected."

          else

            echo "Gradle Wrapper not found."
            echo "System Gradle will be used."

          fi


      # ==========================================
      # 11. Show Signing Configuration
      # ==========================================

      - name: Show Signing Configuration
        shell: bash
        run: |

          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "======================================"
          echo "APP BUILD CONFIGURATION"
          echo "======================================"

          if [ -f "$PROJECT/app/build.gradle" ]; then

            sed -n '1,80p' "$PROJECT/app/build.gradle"

          elif [ -f "$PROJECT/app/build.gradle.kts" ]; then

            sed -n '1,80p' "$PROJECT/app/build.gradle.kts"

          fi


      # ==========================================
      # 12. Build SurveyQuant V1.0.56
      # ==========================================

      - name: Build SurveyQuant V1.0.56
        shell: bash
        run: |

          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          echo "======================================"
          echo "BUILDING SURVEYQUANT V1.0.56"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew clean assembleDebug --stacktrace

          else

            gradle clean assembleDebug --stacktrace

          fi


      # ==========================================
      # 13. Find APK
      # ==========================================

      - name: Find Generated APK
        id: apk
        shell: bash
        run: |

          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 14. Prepare APK
      # ==========================================

      - name: Prepare V1.0.56 APK
        shell: bash
        run: |

          mkdir -p release

          cp \
            "${{ steps.apk.outputs.apk }}" \
            "release/SurveyQuant-V1.0.56-Update.apk"

          echo "======================================"
          echo "APK READY"
          echo "======================================"

          ls -lh release/


      # ==========================================
      # 15. Upload APK
      # ==========================================

      - name: Upload SurveyQuant V1.0.56
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-V1.0.56-Update-Chain
          path: release/SurveyQuant-V1.0.56-Update.apk
          if-no-files-found: error


      # ==========================================
      # 16. Summary
      # ==========================================

      - name: Build Summary
        if: success()
        run: |

          echo ""
          echo "======================================"
          echo "SURVEYQUANT V1.0.56"
          echo "BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK:"
          echo "SurveyQuant-V1.0.56-Update.apk"
          echo ""
          echo "Artifact:"
          echo "SurveyQuant-V1.0.56-Update-Chain"
          echo ""
          echo "======================================"

name: SurveyQuant V1.0.56 Update Chain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chain-v56:
    name: SurveyQuant V1.0.56 Update Chain
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      - name: Verify Current Version
        run: |
          echo "======================================"
          echo "SurveyQuant V1.0.56 Update Chain"
          echo "======================================"
          echo "Repository:"
          git remote -v
          echo ""
          echo "Branch:"
          git branch --show-current
          echo ""
          echo "Commit:"
          git rev-parse --short HEAD

      - name: Clean Previous Build
        run: |
          ./gradlew clean

      - name: Build Update APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "======================================"
          echo "Generated APK Files"
          echo "======================================"
          find . -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/SurveyQuant-V1.0.56-Update.apk"

          echo "APK:"
          ls -lh release/

      - name: Upload Update APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-V1.0.56-Update-Chain
          path: release/SurveyQuant-V1.0.56-Update.apk
          if-no-files-found: error

      - name: Create Update Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v1.0.56" >/dev/null 2>&1; then
            echo "Tag v1.0.56 already exists."
          else
            git tag -a "v1.0.56" -m "SurveyQuant V1.0.56 Update Chain"
            git push origin "v1.0.56"
          fi
